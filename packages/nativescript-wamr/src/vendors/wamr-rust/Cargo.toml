[package]
name = "wamr-sys"
version = "0.1.0"
edition = "2021"
description = "Raw Rust FFI bindings to WAMR (WebAssembly Micro Runtime) — generated by bindgen"
license = "Apache-2.0"

# This crate is not published — it lives inside the @org/nativescript-wamr npm
# package at src/vendors/wamr-rust/. The generated bindings are committed so
# consumers don't need bindgen installed.

[features]
regenerate = []

[build-dependencies]
bindgen = "0.72"

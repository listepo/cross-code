// nativescript-wamr: merged into the NativeScript app's build.gradle.
// The bundled AAR (nativescript-wamr.aar) carries the Kotlin wrapper and
// libwamr_jni.so for all ABIs (built via cargo-ndk from Rust).  No external
// dependencies needed — the JNI library is self-contained.
dependencies {
    // No JavaCPP dependency required.
}

android {
    packagingOptions {
        jniLibs {
            pickFirsts.add("**/libwamr_jni.so")
        }
    }
}

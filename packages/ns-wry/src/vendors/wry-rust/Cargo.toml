[workspace]
members = ["wry-sys", "wry-jni", "wry-ffi"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
debug = true

# Fast iteration profile for nx-buck2 --configuration=debug (BUCK2_MODIFIER=debug).
[profile.debug]
inherits = "dev"
opt-level = 0
debug = true
incremental = true
codegen-units = 256
lto = false

// nativescript-wasm3: merged into the NativeScript app's build.gradle.
// The bundled AAR (nativescript-wasm3.aar) carries the Kotlin wrapper and
// libwasm3_jni.so for all ABIs (built via cargo-ndk from Rust).
dependencies {
    // No JavaCPP dependency required.
}

android {
    packagingOptions {
        jniLibs {
            pickFirsts.add("**/libwasm3_jni.so")
        }
    }
}

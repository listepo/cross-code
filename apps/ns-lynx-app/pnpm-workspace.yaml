# This app is intentionally NOT part of the root monorepo workspace (packages/*):
# the ns CLI needs its own node_modules. Declaring the app directory as its
# own pnpm workspace root gives it a separate install and its own pnpm-lock.yaml.
#
# `lynx/` is a member so one install covers both halves of the app: the
# NativeScript host and the React on Lynx UI it embeds.
packages:
  - lynx
  - ../../packages/ns-rspack
  # ns-rspack depends on it through the `workspace:` protocol (its wasm-loader
  # emits an ESM wrapper over the WebAssembly polyfill), so it must be
  # reachable from here even though the app never imports it.
  - ../../packages/ns-wasm-core
  - ../../packages/ns-lynx
  - ../../packages/ns-rstest

# pnpm 11 blocks dependency build scripts by default (ERR_PNPM_IGNORED_BUILDS).
allowBuilds:
  '@nativescript/core': true
  '@parcel/watcher': true
  'core-js-pure': true

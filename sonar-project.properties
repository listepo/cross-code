# sonar.organization and sonar.projectKey are placeholders: adjust them to match the
# SonarCloud UI after the repository is imported. See the setup guide for details.
sonar.organization=listepo
sonar.projectKey=listepo_cross-code
sonar.projectName=cross-code
sonar.sourceEncoding=UTF-8
sonar.sources=packages,apps,tools
sonar.tests=packages,apps
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.mts,**/*.test.mts,**/tests/**,**/Tests/**,**/src/test/**,**/hosttest/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/target/**,**/test-output/**,**/.gradle/**,**/src/vendors/wamr/**,**/src/vendors/wasm3/**,**/Sources/CWamr/**,**/Sources/CWasm3/**,**/*.wasm,**/pkg/**,**/App_Resources/**,**/platforms/ios/**/*.xcframework/**
sonar.javascript.lcov.reportPaths=packages/ns-wasm-core/test-output/vitest/coverage/lcov.info,packages/ns-wasm3/test-output/vitest/coverage/lcov.info,packages/ns-wamr/test-output/vitest/coverage/lcov.info,packages/ns-wasm-kit-runtime/test-output/vitest/coverage/lcov.info,packages/ns-wasm-chicory/test-output/vitest/coverage/lcov.info,packages/ns-wasm-edge/test-output/vitest/coverage/lcov.info,packages/ns-endive/test-output/vitest/coverage/lcov.info,packages/ns-wry/test-output/vitest/coverage/lcov.info,packages/ns-lynx/test-output/vitest/coverage/lcov.info,packages/ns-rstest/test-output/vitest/coverage/lcov.info,packages/ns-rspack/test-output/rstest/coverage/lcov.info
sonar.rust.lcov.reportPaths=packages/ns-wasm-fixture/target/coverage/lcov.info
# C/C++/Objective-C analysis needs a compilation database; it is off for now (see the guide).
sonar.c.file.suffixes=-
sonar.cpp.file.suffixes=-
sonar.objc.file.suffixes=-

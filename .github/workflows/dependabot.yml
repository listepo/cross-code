# Dependabot pull requests: run the repository's full CI on them, then merge
# patch-level updates only, and only when that CI run is green.
#
# How the gate works:
# - `ci` calls .github/workflows/ci.yml (its `workflow_call` trigger), so a
#   Dependabot pull request runs exactly the jobs any other CI run does.
# - `automerge` needs `ci`. A failed, cancelled or timed-out CI job fails `ci`,
#   and a job whose needs did not all succeed is skipped, so nothing merges.
# - Only `version-update:semver-patch` (version or security update) is merged:
#   a squash merge (the repository allows only squash), pinned to the head
#   commit CI tested. Minor and major updates get the `needs-review` label
#   and wait for a human.
# - Notifications: @listepo becomes a participant (assignee plus a mention)
#   only on pull requests that need him: a major update (his review is also
#   requested) or a failed CI or merge job. Patch and minor pull requests do
#   not assign or mention anyone.
# - GitHub's auto-merge (`gh pr merge --auto`) is never used: with no branch
#   protection on main it merges at once, without waiting for any check.
name: Dependabot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: dependabot-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    # Dependabot's own pull requests only, from a branch of this repository.
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/ci.yml
    # GitHub validates these against every job in ci.yml, including ones that
    # never run for a pull request (such as a push-only revert job). ci.yml's
    # workflow-level `permissions` still caps its build and test jobs.
    permissions:
      actions: read
      contents: read
      pull-requests: write

  automerge:
    name: Merge patch update
    needs: [ci]
    if: >-
      success()
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Refuse if another CI run on this commit did not pass
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: |
          # ci.yml may also run on the pull request by itself; a red, cancelled
          # or timed-out run there blocks the merge too. Runs still in progress
          # are not counted.
          bad=$(gh run list --workflow ci.yml --commit "$HEAD_SHA" \
            --json status,conclusion \
            --jq '[.[] | select(.status == "completed" and .conclusion != "success" and .conclusion != "skipped")] | length')
          if [ "$bad" != "0" ]; then
            echo "::error::$bad ci.yml run(s) on $HEAD_SHA did not pass; not merging."
            exit 1
          fi

      - name: Merge patch update
        if: steps.meta.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"

      - name: Label minor or major update for review
        if: steps.meta.outputs.update-type != 'version-update:semver-patch'
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          echo "Update type '$UPDATE_TYPE' is not a patch update; leaving it for manual review."
          gh pr edit "$PR_URL" --add-label needs-review

      - name: Flag major update for @listepo
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          DEPS: ${{ steps.meta.outputs.dependency-names }}
          PREV: ${{ steps.meta.outputs.previous-version }}
          NEW: ${{ steps.meta.outputs.new-version }}
        run: |
          gh pr edit "$PR_URL" --add-assignee listepo \
            || echo "::warning::Could not assign listepo."
          gh pr edit "$PR_URL" --add-reviewer listepo \
            || echo "::warning::Could not request a review from listepo."
          gh pr comment "$PR_URL" --body "@listepo Major update of \`$DEPS\` ($PREV -> $NEW); CI is green. It is never auto-merged: please review and merge (or close) it."

  notify-failure:
    name: Notify on failure
    needs: [ci, automerge]
    # failure() is true when `ci` or `automerge` failed; a run cancelled by a
    # newer push is not a failure and stays silent.
    if: >-
      failure()
      && github.actor == 'dependabot[bot]'
      && github.event.pull_request.user.login == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      PR_URL: ${{ github.event.pull_request.html_url }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Assign and mention @listepo with the failing jobs
        run: |
          # The backticks inside the jq program are Markdown, not shell.
          # shellcheck disable=SC2016
          failed=$(gh run view "$GITHUB_RUN_ID" --json jobs \
            --jq '[.jobs[] | select(.conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "cancelled") | "- `" + .name + "` (" + .conclusion + ")"] | join("\n")')
          [ -n "$failed" ] || failed="- (could not list the failing jobs; see the run)"
          gh pr edit "$PR_URL" --add-assignee listepo \
            || echo "::warning::Could not assign listepo."
          printf '@listepo CI or the merge step failed on this Dependabot pull request, so it was not merged.\n\nFailing jobs:\n%s\n\nRun: %s\n' "$failed" "$RUN_URL" > comment.md
          gh pr comment "$PR_URL" --body-file comment.md

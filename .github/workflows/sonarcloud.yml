name: sonarcloud

# SonarCloud OSS analysis: pull requests to main (drafts skipped), pushes to main, and manual
# runs. Soft-fail for now: the coverage and scan steps use continue-on-error, and every step
# soft-skips when the SONAR_TOKEN secret is empty (fork pull requests, or before the secret is
# added). Setup and how to make it blocking: docs/sonarcloud-setup.md
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  # Empty on fork pull requests and until the repository secret is added.
  SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

jobs:
  sonarcloud:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Skip SonarCloud (no token)
        if: env.SONAR_TOKEN == ''
        run: |
          echo "::notice::SONAR_TOKEN is not set; skipping SonarCloud analysis."
          echo "Expected for fork pull requests and before the secret is added."
          echo "See docs/sonarcloud-setup.md."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SONAR_TOKEN != ''
        with:
          # Full history: Sonar uses blame data for new-code detection.
          fetch-depth: 0

      # Same setup as the ci.yml unit-tests job: pnpm from packageManager, Node 24.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        if: env.SONAR_TOKEN != ''

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SONAR_TOKEN != ''
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        if: env.SONAR_TOKEN != ''
        run: pnpm install --frozen-lockfile

      # Same steps as the ci.yml unit-tests job: build the plugins, then per-project
      # coverage (vitest v8 for the TS packages, llvm-cov for the Rust fixture).
      - name: Build the plugins
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: pnpm exec nx run-many -t build

      - name: Coverage (LCOV)
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        run: |
          rustup component add llvm-tools-preview
          pnpm exec nx run-many -t coverage

      - name: SonarCloud scan
        if: env.SONAR_TOKEN != ''
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: npx nx record -- npx nx format:check --base="remotes/origin/main"
      # - run: npx nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      # - run: npx nx fix-ci
      #   if: always()
      # - run: npx nx format:check --base="remotes/origin/main"

  # Vitest, TypeScript and the Rust fixture crate. Everything here runs on a
  # plain Linux runner: the .wasm fixtures are committed build outputs, so no
  # wasm-pack, Android SDK or Xcode is needed. Rust comes preinstalled on the
  # GitHub-hosted ubuntu image.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            apps/nativescript-wasm-test/package-lock.json

      - run: npm ci

      # The NativeScript app is not an npm workspace member — the CLI needs its
      # own node_modules — and its typecheck resolves @nativescript/types and
      # TypeScript from there. The vitest specs do not need it.
      - name: Install the test app's dependencies
        working-directory: apps/nativescript-wasm-test
        run: npm ci

      # nativescript-wasm3: 26 specs. nativescript-wasm-test: 22 specs that run
      # the fixture module through the plugin's public API on Node's own
      # WebAssembly engine. Plus the typecheck of all three projects.
      - name: Vitest + typecheck
        run: npx nx run-many -t test typecheck

      # The fixture crate: wasm exports plus the globals.wasm byte encoder.
      - name: Rust unit tests
        run: npx nx run nativescript-wasm-fixture:test.wasm

      # globals.wasm is committed but generated, and the generator is
      # deterministic — so a stale copy is a hard error rather than a surprise
      # on someone's device. (test_types_bg.wasm needs wasm-pack to rebuild and
      # is not byte-reproducible, so it is not checked here.)
      - name: Verify the committed globals.wasm matches its generator
        run: |
          cargo run --quiet \
            --manifest-path packages/nativescript-wasm-fixture/src/test-types/Cargo.toml \
            --bin gen_globals -- "$RUNNER_TEMP/globals"
          cmp "$RUNNER_TEMP/globals/globals.wasm" \
            packages/nativescript-wasm-fixture/src/test-types/pkg/globals.wasm || {
            echo "::error::globals.wasm is stale — run 'npm run build.wasm' in packages/nativescript-wasm-fixture and commit the result."
            exit 1
          }

  # The nativescript-wasm3 native suites below need a macOS runner / an Android
  # SDK, so they only run when the plugin or this workflow changed. Fails open:
  # any detection problem runs them anyway.
  changes:
    runs-on: ubuntu-latest
    outputs:
      wasm3: ${{ steps.filter.outputs.wasm3 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          run_all() { echo "wasm3=true" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "${{ github.event_name }}" = "pull_request" ] || run_all

          base="refs/remotes/origin/${{ github.base_ref }}"
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:$base" || run_all
          changed="$(git diff --name-only "$base...HEAD")" || run_all

          echo "$changed"
          if grep -qE '^(packages/nativescript-wasm3/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "wasm3=true" >> "$GITHUB_OUTPUT"
          else
            echo "wasm3=false" >> "$GITHUB_OUTPUT"
          fi

  # iOS: compiles the vendored wasm3 C sources through SwiftPM and runs the
  # XCTest suite, which exercises the interpreter natively on macOS.
  wasm3-ios:
    needs: changes
    if: needs.changes.outputs.wasm3 == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify the synced Swift package copy is current
        working-directory: packages/nativescript-wasm3
        run: |
          node tools/sync-wasm3.mjs
          git diff --exit-code -- . || {
            echo "::error::platforms/ios/NSCWasm3/Sources/CWasm3 is stale — run 'npm run sync.vendors' and commit the result."
            exit 1
          }

      - name: Swift tests
        working-directory: packages/nativescript-wasm3/platforms/ios/NSCWasm3
        run: swift test

      - name: Build for iOS device
        working-directory: packages/nativescript-wasm3/platforms/ios/NSCWasm3
        run: |
          xcodebuild build \
            -scheme NSCWasm3 \
            -destination 'generic/platform=iOS'

  # Android: regenerates the JavaCPP bindings from wasm3.h and runs the Kotlin
  # wrapper's JUnit suite against a host build of wasm3 — no emulator needed.
  wasm3-android:
    needs: changes
    if: needs.changes.outputs.wasm3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: JVM host tests (JavaCPP bindings + Kotlin wrapper)
        working-directory: packages/nativescript-wasm3/platforms/android/wasm3-android
        run: ./gradlew :hosttest:test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wasm3-android-test-report
          path: packages/nativescript-wasm3/platforms/android/wasm3-android/hosttest/build/reports/tests/test

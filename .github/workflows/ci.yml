name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # pnpm is the default package manager (packageManager in package.json);
      # pnpm/action-setup installs the pinned version from there.
      - uses: pnpm/action-setup@v4

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      # This enables task distribution via Nx Cloud.
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: pnpm exec nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      # - run: pnpm exec nx record -- pnpm exec nx format:check --base="remotes/origin/main"
      # - run: pnpm exec nx run-many -t lint test build typecheck e2e
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      # - run: pnpm exec nx fix-ci
      #   if: always()
      # - run: pnpm exec nx format:check --base="remotes/origin/main"

  # Vitest, TypeScript and the Rust fixture crate. Everything here runs on a
  # plain Linux runner: the .wasm fixtures are committed build outputs, so no
  # wasm-pack, Android SDK or Xcode is needed. Rust comes preinstalled on the
  # GitHub-hosted ubuntu image.
  #
  # The test app's own suite is not here — it runs on a simulator/emulator, in
  # the wasm-test-ios and wasm-test-android jobs below.
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/nativescript-wasm-test/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The NativeScript app is not a pnpm workspace member (it has its own
      # pnpm-workspace.yaml) — the CLI needs its own node_modules — and its
      # typecheck resolves @nativescript/types, Vitest and TypeScript
      # from there.
      - name: Install the test app's dependencies
        working-directory: apps/nativescript-wasm-test
        run: pnpm install --frozen-lockfile

      # Vitest specs plus the typecheck of all projects — including the test
      # app's NativeScript specs, which are type-checked
      # here even though they can only run on a device.
      - name: Vitest + typecheck
        run: pnpm exec nx run-many -t test typecheck

      # Rust is pre-installed on GitHub's ubuntu-latest runner. When debugging
      # locally with `act` the slim image may not have it — install on the fly
      # so the same workflow is self-contained.
      - name: Install Rust (if missing)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      # The fixture crate: wasm exports plus the globals.wasm byte encoder.
      - name: Rust unit tests
        run: pnpm exec nx run nativescript-wasm-fixture:test.wasm

      # globals.wasm is committed but generated, and the generator is
      # deterministic — so a stale copy is a hard error rather than a surprise
      # on someone's device. (test_types_bg.wasm needs wasm-pack to rebuild and
      # is not byte-reproducible, so it is not checked here.)
      - name: Verify the committed globals.wasm matches its generator
        run: |
          cargo run --quiet \
            --manifest-path packages/nativescript-wasm-fixture/src/test-types/Cargo.toml \
            --bin gen_globals -- "$RUNNER_TEMP/globals"
          cmp "$RUNNER_TEMP/globals/globals.wasm" \
            packages/nativescript-wasm-fixture/src/test-types/pkg/globals.wasm || {
            echo "::error::globals.wasm is stale — run 'pnpm run build.wasm' in packages/nativescript-wasm-fixture and commit the result."
            exit 1
          }

  # The nativescript-wasm3 native suites below need a macOS runner / an Android
  # SDK, so they only run when the plugin or this workflow changed. Fails open:
  # any detection problem runs them anyway.
  changes:
    runs-on: ubuntu-latest
    outputs:
      wasm3: ${{ steps.filter.outputs.wasm3 }}
      wamr: ${{ steps.filter.outputs.wamr }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: filter
        shell: bash
        run: |
          run_all() {
            {
              echo "wasm3=true"
              echo "wamr=true"
              echo "app=true"
            } >> "$GITHUB_OUTPUT"
            exit 0
          }
          [ "${{ github.event_name }}" = "pull_request" ] || run_all

          base="refs/remotes/origin/${{ github.base_ref }}"
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:$base" || run_all
          changed="$(git diff --name-only "$base...HEAD")" || run_all

          echo "$changed"
          if grep -qE '^(packages/nativescript-wasm3/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "wasm3=true" >> "$GITHUB_OUTPUT"
          else
            echo "wasm3=false" >> "$GITHUB_OUTPUT"
          fi

          if grep -qE '^(packages/nativescript-wamr/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "wamr=true" >> "$GITHUB_OUTPUT"
          else
            echo "wamr=false" >> "$GITHUB_OUTPUT"
          fi

          # The app's suite runs the plugin end to end, so a plugin or fixture
          # change is as relevant to it as a change to the app itself.
          if grep -qE '^(apps/nativescript-wasm-test/|packages/nativescript-wasm3/|packages/nativescript-wamr/|packages/nativescript-wasm-fixture/|\.github/workflows/ci\.yml$)' <<<"$changed"; then
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  # iOS: compiles the vendored wasm3 C sources through SwiftPM and runs the
  # XCTest suite, which exercises the interpreter natively on macOS.
  wasm3-ios:
    needs: changes
    if: needs.changes.outputs.wasm3 == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Verify the synced Swift package copy is current
        working-directory: packages/nativescript-wasm3
        run: |
          node tools/sync-wasm3.mjs
          git diff --exit-code -- . || {
            echo "::error::platforms/ios/NSCWasm3/Sources/CWasm3 is stale — run 'pnpm run sync.vendors' and commit the result."
            exit 1
          }

      - name: Swift tests
        working-directory: packages/nativescript-wasm3/platforms/ios/NSCWasm3
        run: swift test --disable-sandbox

      - name: Build for iOS device
        working-directory: packages/nativescript-wasm3/platforms/ios/NSCWasm3
        run: |
          xcodebuild build \
            -scheme NSCWasm3 \
            -destination 'generic/platform=iOS'

  # Android: builds the wasm3-jni Rust crate via cargo and runs the Kotlin
  # wrapper's JUnit hosttest suite — no emulator needed.
  wasm3-android:
    needs: changes
    if: needs.changes.outputs.wasm3 == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Gradle shells out to build-native.mjs (zx) to generate the bindings and
      # compile wasm3, so the native build needs Node and the root node_modules.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4.9.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4.4.4
        with:
          validate-wrappers: false

      # Rust is pre-installed on ubuntu-latest; install if missing (e.g. act).
      - name: Install Rust (if missing)
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: JVM host tests (cargo build + Kotlin wrapper)
        working-directory: packages/nativescript-wasm3/platforms/android/wasm3-android
        run: ./gradlew :hosttest:test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: wasm3-android-test-report
          path: packages/nativescript-wasm3/platforms/android/wasm3-android/hosttest/build/reports/tests/test

  # The test app's Vitest suite, on a simulator and an emulator. This is the only
  # place the plugin's TypeScript adapters run against the real native layer —
  # the NSData/NSArray marshalling on iOS, the signed byte[] handling on Android
  # — so it covers what neither the Swift/Kotlin suites nor a Node runner can.
  # iOS: compiles the vendored WAMR C sources through SwiftPM and runs the
  # XCTest suite, which exercises the runtime natively on macOS.
  wamr-ios:
    needs: changes
    if: needs.changes.outputs.wamr == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Check for WAMR C sources
        id: sources
        run: |
          if find packages/nativescript-wamr/src/vendors/wamr -name '*.c' -o -name '*.h' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WAMR C sources not found — Swift steps will be skipped."
          fi

      - name: Verify the synced Swift package copy is current
        if: steps.sources.outputs.present == 'true'
        working-directory: packages/nativescript-wamr
        run: |
          node tools/sync-wamr.mjs
          git diff --exit-code -- . || {
            echo "::error::platforms/ios/NSCWamr/Sources/CWamr is stale — run 'pnpm run sync.vendors' and commit the result."
            exit 1
          }

      - name: Swift tests
        if: steps.sources.outputs.present == 'true'
        working-directory: packages/nativescript-wamr/platforms/ios/NSCWamr
        run: swift test --disable-sandbox

      - name: Build for iOS device
        if: steps.sources.outputs.present == 'true'
        working-directory: packages/nativescript-wamr/platforms/ios/NSCWamr
        run: |
          xcodebuild build \
            -scheme NSCWamr \
            -destination 'generic/platform=iOS'

  # Android: builds the wamr-jni Rust crate via cargo and runs the Kotlin
  # wrapper's JUnit hosttest suite — no emulator.
  wamr-android:
    needs: changes
    if: needs.changes.outputs.wamr == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Check for WAMR C sources
        id: sources
        run: |
          if find packages/nativescript-wamr/src/vendors/wamr -name '*.c' -o -name '*.h' | grep -q .; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::WAMR C sources not found — Gradle steps will be skipped."
          fi

      - uses: actions/setup-java@v4.9.0
        if: steps.sources.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4.4.4
        if: steps.sources.outputs.present == 'true'
        with:
          validate-wrappers: false

      # Rust is pre-installed on ubuntu-latest; install if missing (e.g. act).
      - name: Install Rust (if missing)
        if: steps.sources.outputs.present == 'true'
        run: |
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

      - name: JVM host tests (cargo build + Kotlin wrapper)
        if: steps.sources.outputs.present == 'true'
        working-directory: packages/nativescript-wamr/platforms/android/wamr-android
        run: ./gradlew :hosttest:test

      - uses: actions/upload-artifact@v4
        if: failure() && steps.sources.outputs.present == 'true'
        with:
          name: wamr-android-test-report
          path: packages/nativescript-wamr/platforms/android/wamr-android/hosttest/build/reports/tests/test

  # The test app's Vitest suite, on a simulator and an emulator. This is the only
  # place the plugin's TypeScript adapters run against the real native layer —
  # the NSData/NSArray marshalling on iOS, the signed byte[] handling on Android
  # — so it covers what neither the Swift/Kotlin suites nor a Node runner can.
  wasm-test-ios:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/nativescript-wasm-test/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # The app resolves both plugins through file: dependencies and imports
      # their built dist/, so TypeScript must exist before bundling.
      - name: Build the plugins
        run: pnpm exec nx run-many -t build -p nativescript-wasm3 nativescript-wamr

      - name: Install the test app's dependencies
        working-directory: apps/nativescript-wasm-test
        run: pnpm install --frozen-lockfile

      # `ns doctor` shells out to `pod --version`, which prints a locale warning
      # the CLI treats as a failed CocoaPods check unless LANG is a UTF-8 one.
      # The plugin itself needs no pods — it ships a Swift package.
      - name: Vitest specs on the iOS Simulator
        working-directory: .
        env:
          LANG: en_US.UTF-8
        run: pnpm exec nx run nativescript-wasm-test:test.ios

  wasm-test-android:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'
          cache-dependency-path: |
            pnpm-lock.yaml
            apps/nativescript-wasm-test/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build the plugin
        run: pnpm exec nx run nativescript-wasm3:build

      - name: Install the test app's dependencies
        working-directory: apps/nativescript-wasm-test
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-java@v4.9.0
        with:
          distribution: temurin
          java-version: '17'

      # Lets the emulator use hardware acceleration on the GitHub runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The wasm3 plugin ships a prebuilt .aar with its .so files.
      # WAMR tests will fail at runtime without it (known: continue-on-error).
      - name: Vitest specs on the Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          working-directory: .
          script: pnpm exec nx run nativescript-wasm-test:test.android

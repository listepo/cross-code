# Semgrep static analysis with the free open-source CLI and the community `p/default` registry
# ruleset (no Semgrep account or token). Results land in the Security tab (Code scanning,
# category `semgrep`). Findings never fail the job, so this workflow does not block CI.
name: semgrep

on:
  # Push to main, non-draft pull requests and the weekly schedule run this through
  # pipeline.yml (`workflow_call`), in parallel with the other checks and behind its `gate` job.
  workflow_call:
  workflow_dispatch:

jobs:
  scan:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    container:
      # semgrep/semgrep:1.177.0
      image: semgrep/semgrep@sha256:acaac22ffc7b7cc5926de0751b223bce0b2491c33d18422fa72f632c78d81198
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No `--error`: findings are reported, not enforced. Metrics off since no account is used.
      - name: Semgrep scan
        run: semgrep scan --config p/default --sarif --output semgrep.sarif --metrics off
      - uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

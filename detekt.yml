# Shared Detekt configuration for the hand-written Kotlin in the NativeScript
# Android plugins (the NSCWasm3/NSCWamr wrappers in :library and the JVM host
# tests in :hosttest). This file is built upon the detekt default config
# (buildUponDefaultConfig = true in each engine's build.gradle.kts); only
# deviations from the defaults live here, each with a comment explaining why.
#
# Generated code never reaches Detekt: the source set in build.gradle.kts is
# restricted to **/src/**/*.kt and excludes build/, bin/, uniffi/ and .kotlin/.

build:
  maxIssues: 0

complexity:
  # NativeWasm3/NativeWamr are flat JNI declaration facades: one
  # `external fun` per native entry point (~30). The default object
  # threshold of 11 doesn't fit.  NSCChicory* wrapper classes also
  # exceed the default class threshold.
  TooManyFunctions:
    thresholdInObjects: 40
    thresholdInClasses: 20

style:
  # HostTrampoline.invoke returns early on each trap condition (bad result
  # type, wrong result count, unencodable value). The default max of 2
  # returns doesn't fit the trampoline pattern.
  ReturnCount:
    max: 4

  # The wrappers validate every JNI result at its call site and throw
  # NSCWasm3Exception/NSCWamrException directly (3 throws in setGlobal/call).
  # The default max of 2 throws per function is too strict for this style.
  ThrowsCount:
    max: 4
